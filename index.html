<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CBZ Reader</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    :root {
      --bg:          #0a0a0f;
      --surface:     #13131a;
      --surface2:    #1a1a24;
      --surface3:    #20202e;
      --border:      #1e1e2e;
      --border2:     #2a2a3e;
      --accent:      #7c6bff;
      --accent-dim:  rgba(124,107,255,0.15);
      --accent-glow: rgba(124,107,255,0.35);
      --danger:      #ff5f5f;
      --success:     #4ade80;
      --text:        #e8e6f0;
      --text-muted:  #6b6880;
      --text-faint:  #3a3850;
      --radius:      10px;
      --radius-lg:   16px;
    }
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* ───── TOPBAR ───── */
    .topbar {
      position: fixed; top:0; left:0; width:100%; z-index:1000;
      background: rgba(10,10,15,0.88);
      backdrop-filter: blur(20px) saturate(160%);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
      box-shadow: 0 1px 0 0 var(--border), 0 4px 30px rgba(0,0,0,.5);
      padding: 0 20px; height: 58px;
      display: flex; align-items: center; gap: 8px;
      transition: transform .35s cubic-bezier(.4,0,.2,1), opacity .35s ease;
    }
    .topbar.hidden { transform: translateY(-100%); opacity:0; }

    .brand {
      display:flex; align-items:center; gap:10px;
      cursor:pointer; text-decoration:none;
    }
    .brand-icon {
      width:30px; height:30px;
      background: var(--accent-dim);
      border: 1px solid var(--accent-glow);
      border-radius:8px;
      display:flex; align-items:center; justify-content:center;
      color: var(--accent);
    }
    .brand-name { font-size:15px; font-weight:600; letter-spacing:-.01em; color:var(--text); }

    .filename {
      font-family:'JetBrains Mono',monospace; font-size:11px;
      color:var(--text-muted); max-width:200px;
      overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    }
    .divider { width:1px; height:24px; background:var(--border); margin:0 4px; flex-shrink:0; }

    .zoom-group {
      display:flex; align-items:center; gap:2px;
      background:var(--surface); border:1px solid var(--border);
      border-radius:var(--radius); padding:3px;
    }
    .zoom-group button {
      background:transparent; border:none; color:var(--text-muted);
      width:30px; height:30px; border-radius:7px; cursor:pointer;
      font-size:16px; font-family:'Inter',sans-serif;
      display:flex; align-items:center; justify-content:center;
      transition:background .15s, color .15s; padding:0;
    }
    .zoom-group button:hover { background:var(--surface2); color:var(--text); }
    #zoomReset {
      font-size:12px !important; font-weight:500;
      font-family:'JetBrains Mono',monospace !important;
      width:52px !important; color:var(--text) !important;
      letter-spacing:-.03em;
    }

    .topbar-spacer { flex:1; }

    /* Library button */
    .lib-btn {
      display:flex; align-items:center; gap:6px;
      background:var(--surface); border:1px solid var(--border2);
      color:var(--text); padding:7px 14px; border-radius:var(--radius);
      cursor:pointer; font-size:13px; font-weight:500; font-family:'Inter',sans-serif;
      transition:background .2s, border-color .2s; white-space:nowrap;
    }
    .lib-btn:hover { background:var(--surface2); border-color:var(--accent); }

    /* Upload button */
    .upload-wrap { position:relative; overflow:hidden; }
    .upload-wrap label {
      display:flex; align-items:center; gap:7px;
      background:var(--accent); color:#fff;
      padding:7px 14px; border-radius:var(--radius);
      cursor:pointer; font-size:13px; font-weight:500; font-family:'Inter',sans-serif;
      transition:background .2s, box-shadow .2s; white-space:nowrap;
    }
    .upload-wrap label:hover { background:#8d7dff; box-shadow:0 0 16px var(--accent-glow); }
    .upload-wrap input[type="file"] { position:absolute; inset:0; opacity:0; cursor:pointer; font-size:0; }

    /* User avatar chip */
    .user-chip {
      display:flex; align-items:center; gap:8px;
      background:var(--surface); border:1px solid var(--border2);
      border-radius:var(--radius); padding:5px 10px;
      cursor:pointer; transition:background .2s;
    }
    .user-chip:hover { background:var(--surface2); }
    .avatar {
      width:24px; height:24px; border-radius:50%;
      background:var(--accent-dim); border:1px solid var(--accent-glow);
      display:flex; align-items:center; justify-content:center;
      font-size:11px; font-weight:600; color:var(--accent);
    }
    .chip-name { font-size:13px; font-weight:500; max-width:100px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

    /* ───── READER ───── */
    #reader { width:100%; margin-top:58px; }
    .page {
      width:100%; display:block; margin:0 auto;
      transition:width .15s ease; opacity:0;
    }
    .page.visible { animation: fadeIn .4s ease forwards; }
    img { display:block; height:auto; }

    @keyframes fadeIn {
      from { opacity:0; transform:translateY(6px); }
      to   { opacity:1; transform:translateY(0); }
    }

    /* ───── STATES ───── */
    .state-wrapper {
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      min-height:calc(100vh - 58px); gap:16px; padding:40px 20px;
      color:var(--text-muted);
    }
    .state-icon {
      width:64px; height:64px; background:var(--surface); border:1px solid var(--border);
      border-radius:18px; display:flex; align-items:center; justify-content:center;
      font-size:28px; margin-bottom:4px;
    }
    .state-title { font-size:16px; font-weight:600; color:var(--text); letter-spacing:-.01em; }
    .state-sub { font-size:13px; color:var(--text-muted); text-align:center; max-width:280px; line-height:1.6; }
    .loading-bar-wrap { width:200px; height:3px; background:var(--surface2); border-radius:99px; overflow:hidden; }
    .loading-bar { height:100%; width:40%; background:var(--accent); border-radius:99px; animation:slide 1.2s ease-in-out infinite; }
    @keyframes slide { 0%{transform:translateX(-100%)} 100%{transform:translateX(600%)} }

    /* ───── MODAL BASE ───── */
    .modal-overlay {
      position:fixed; inset:0; z-index:2000;
      background:rgba(0,0,0,.7); backdrop-filter:blur(6px);
      display:flex; align-items:center; justify-content:center;
      padding:20px; opacity:0; pointer-events:none;
      transition:opacity .25s ease;
    }
    .modal-overlay.open { opacity:1; pointer-events:all; }
    .modal {
      background:var(--surface); border:1px solid var(--border2);
      border-radius:var(--radius-lg); width:100%; max-width:420px;
      padding:32px; position:relative;
      transform:translateY(12px); transition:transform .25s ease;
      box-shadow:0 24px 80px rgba(0,0,0,.6);
    }
    .modal-overlay.open .modal { transform:translateY(0); }
    .modal-close {
      position:absolute; top:14px; right:14px;
      background:transparent; border:none; color:var(--text-muted);
      width:30px; height:30px; border-radius:8px; cursor:pointer; font-size:18px;
      display:flex; align-items:center; justify-content:center;
      transition:background .15s, color .15s;
    }
    .modal-close:hover { background:var(--surface2); color:var(--text); }
    .modal h2 { font-size:20px; font-weight:600; letter-spacing:-.02em; margin-bottom:6px; }
    .modal-sub { font-size:13px; color:var(--text-muted); margin-bottom:24px; line-height:1.5; }

    /* Form */
    .field { display:flex; flex-direction:column; gap:6px; margin-bottom:16px; }
    .field label { font-size:12px; font-weight:500; color:var(--text-muted); letter-spacing:.02em; text-transform:uppercase; }
    .field input {
      background:var(--surface2); border:1px solid var(--border2);
      border-radius:var(--radius); padding:10px 14px;
      color:var(--text); font-size:14px; font-family:'Inter',sans-serif;
      outline:none; transition:border-color .2s, box-shadow .2s;
      width:100%;
    }
    .field input:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-dim); }
    .field input::placeholder { color:var(--text-faint); }

    .btn-primary {
      width:100%; background:var(--accent); color:#fff; border:none;
      border-radius:var(--radius); padding:11px; font-size:14px; font-weight:600;
      cursor:pointer; font-family:'Inter',sans-serif;
      transition:background .2s, box-shadow .2s; margin-top:4px;
    }
    .btn-primary:hover { background:#8d7dff; box-shadow:0 0 20px var(--accent-glow); }

    .modal-switch { margin-top:16px; text-align:center; font-size:13px; color:var(--text-muted); }
    .modal-switch a { color:var(--accent); cursor:pointer; text-decoration:none; font-weight:500; }
    .modal-switch a:hover { text-decoration:underline; }

    .form-error {
      background:rgba(255,95,95,.12); border:1px solid rgba(255,95,95,.3);
      color:var(--danger); border-radius:8px; padding:10px 14px;
      font-size:13px; margin-bottom:14px; display:none;
    }
    .form-error.show { display:block; }

    /* ───── LIBRARY MODAL ───── */
    .lib-modal { max-width:680px; padding:28px; }
    .lib-header {
      display:flex; align-items:center; justify-content:space-between;
      margin-bottom:20px;
    }
    .lib-header h2 { font-size:18px; font-weight:600; letter-spacing:-.02em; }
    .lib-actions { display:flex; gap:8px; align-items:center; }

    .lib-upload-wrap { position:relative; overflow:hidden; }
    .lib-upload-wrap label {
      display:flex; align-items:center; gap:6px;
      background:var(--accent); color:#fff; padding:7px 14px;
      border-radius:var(--radius); cursor:pointer; font-size:13px; font-weight:500;
      transition:background .2s; white-space:nowrap;
    }
    .lib-upload-wrap label:hover { background:#8d7dff; }
    .lib-upload-wrap input { position:absolute; inset:0; opacity:0; cursor:pointer; font-size:0; }

    /* Search bar */
    .lib-search {
      width:100%; background:var(--surface2); border:1px solid var(--border2);
      border-radius:var(--radius); padding:9px 14px; color:var(--text);
      font-size:13px; font-family:'Inter',sans-serif; outline:none;
      transition:border-color .2s; margin-bottom:16px;
    }
    .lib-search:focus { border-color:var(--accent); }
    .lib-search::placeholder { color:var(--text-faint); }

    .lib-grid {
      display:grid; grid-template-columns:repeat(auto-fill, minmax(140px,1fr));
      gap:12px; max-height:420px; overflow-y:auto;
      padding-right:4px;
    }
    .lib-grid::-webkit-scrollbar { width:4px; }
    .lib-grid::-webkit-scrollbar-track { background:transparent; }
    .lib-grid::-webkit-scrollbar-thumb { background:var(--border2); border-radius:99px; }

    .lib-card {
      background:var(--surface2); border:1px solid var(--border);
      border-radius:var(--radius); overflow:hidden;
      cursor:pointer; transition:border-color .2s, transform .15s, box-shadow .2s;
      position:relative;
    }
    .lib-card:hover { border-color:var(--accent); transform:translateY(-2px); box-shadow:0 8px 24px rgba(0,0,0,.4); }

    .lib-card-thumb {
      width:100%; aspect-ratio:2/3; background:var(--surface3);
      display:flex; align-items:center; justify-content:center;
      font-size:32px; position:relative; overflow:hidden;
    }
    .lib-card-thumb img { width:100%; height:100%; object-fit:cover; }

    .lib-card-body { padding:10px; }
    .lib-card-name {
      font-size:12px; font-weight:500; line-height:1.4;
      overflow:hidden; display:-webkit-box; -webkit-line-clamp:2;
      -webkit-box-orient:vertical; color:var(--text);
    }
    .lib-card-meta { font-size:11px; color:var(--text-muted); margin-top:4px; font-family:'JetBrains Mono',monospace; }

    .lib-card-del {
      position:absolute; top:6px; right:6px;
      background:rgba(10,10,15,.8); border:1px solid var(--border2);
      border-radius:6px; width:26px; height:26px;
      display:flex; align-items:center; justify-content:center;
      cursor:pointer; opacity:0; transition:opacity .15s, background .15s;
      color:var(--text-muted); font-size:14px;
    }
    .lib-card:hover .lib-card-del { opacity:1; }
    .lib-card-del:hover { background:rgba(255,95,95,.2); color:var(--danger); border-color:var(--danger); }

    .lib-empty {
      grid-column:1/-1; display:flex; flex-direction:column;
      align-items:center; gap:12px; padding:48px 20px;
      color:var(--text-muted); text-align:center;
    }
    .lib-empty-icon { font-size:36px; }
    .lib-empty-title { font-size:15px; font-weight:600; color:var(--text); }
    .lib-empty-sub { font-size:13px; max-width:220px; line-height:1.6; }

    /* Upload progress inside lib */
    .lib-progress {
      background:var(--surface3); border:1px solid var(--border2);
      border-radius:var(--radius); padding:12px 14px;
      margin-bottom:14px; display:none; gap:10px; align-items:center;
    }
    .lib-progress.show { display:flex; }
    .lib-progress-name { font-size:13px; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .lib-progress-bar-wrap { width:100px; height:3px; background:var(--surface2); border-radius:99px; overflow:hidden; }
    .lib-progress-bar { height:100%; background:var(--accent); border-radius:99px; width:0%; transition:width .2s; }

    /* User menu dropdown */
    .user-menu {
      position:absolute; top:calc(100% + 8px); right:0;
      background:var(--surface); border:1px solid var(--border2);
      border-radius:var(--radius); min-width:180px;
      box-shadow:0 12px 40px rgba(0,0,0,.5); z-index:1100;
      overflow:hidden; opacity:0; pointer-events:none;
      transform:translateY(-4px); transition:opacity .15s, transform .15s;
    }
    .user-menu.open { opacity:1; pointer-events:all; transform:translateY(0); }
    .user-menu-header { padding:12px 14px 10px; border-bottom:1px solid var(--border); }
    .user-menu-name { font-size:13px; font-weight:600; }
    .user-menu-email { font-size:11px; color:var(--text-muted); margin-top:2px; font-family:'JetBrains Mono',monospace; }
    .user-menu-item {
      display:flex; align-items:center; gap:10px;
      padding:10px 14px; cursor:pointer; font-size:13px;
      transition:background .15s; color:var(--text-muted);
    }
    .user-menu-item:hover { background:var(--surface2); color:var(--text); }
    .user-menu-item.danger { color:var(--danger); }
    .user-menu-item.danger:hover { background:rgba(255,95,95,.1); }
    .user-menu-wrap { position:relative; }

    /* Toast */
    .toast {
      position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(8px);
      background:var(--surface); border:1px solid var(--border2);
      border-radius:var(--radius); padding:10px 18px;
      font-size:13px; font-weight:500; z-index:3000;
      box-shadow:0 8px 32px rgba(0,0,0,.4);
      opacity:0; pointer-events:none;
      transition:opacity .25s, transform .25s;
      display:flex; align-items:center; gap:8px;
      white-space:nowrap;
    }
    .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
    .toast.success .toast-dot { background:var(--success); }
    .toast.error   .toast-dot { background:var(--danger); }
    .toast-dot { width:7px; height:7px; border-radius:50%; flex-shrink:0; }
  </style>
</head>
<body>

<!-- ── TOPBAR ── -->
<div class="topbar" id="topbar">
  <!-- Brand -->
  <div class="brand" id="brandHome">
    <div class="brand-icon">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <rect x="2" y="1" width="8" height="12" rx="1.5" stroke="currentColor" stroke-width="1.4"/>
        <path d="M10 3h2.5a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H10" stroke="currentColor" stroke-width="1.4"/>
        <line x1="4.5" y1="4.5" x2="7.5" y2="4.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
        <line x1="4.5" y1="6.5" x2="7.5" y2="6.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
      </svg>
    </div>
    <span class="brand-name">CBZ Reader</span>
  </div>

  <span class="filename" id="filename"></span>
  <div class="topbar-spacer"></div>

  <!-- Zoom (hidden until reading) -->
  <div class="zoom-group" id="zoomGroup" style="display:none">
    <button id="zoomOut" title="Zoom out">−</button>
    <button id="zoomReset" title="Reset zoom">100%</button>
    <button id="zoomIn" title="Zoom in">+</button>
  </div>
  <div class="divider" id="zoomDivider" style="display:none"></div>

  <!-- Auth area (shown when logged out) -->
  <div id="authArea" style="display:flex;gap:8px;align-items:center;">
    <button class="lib-btn" id="showLoginBtn">Sign in</button>
    <button class="lib-btn" style="background:var(--accent);border-color:var(--accent);color:#fff;" id="showSignupBtn">Sign up</button>
  </div>

  <!-- Logged-in area (hidden until login) -->
  <div id="loggedArea" style="display:none;gap:8px;align-items:center;">

    <!-- Library button -->
    <button class="lib-btn" id="openLibBtn">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
        <rect x="1" y="2" width="3" height="10" rx="1" stroke="currentColor" stroke-width="1.3"/>
        <rect x="5.5" y="2" width="3" height="10" rx="1" stroke="currentColor" stroke-width="1.3"/>
        <rect x="10" y="2" width="3" height="10" rx="1" stroke="currentColor" stroke-width="1.3"/>
      </svg>
      Library
    </button>

    <div class="divider"></div>

    <!-- Upload -->
    <div class="upload-wrap">
      <label for="fileInput">
        <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
          <path d="M6.5 1v8M3.5 4l3-3 3 3" stroke="white" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M1 10.5h11" stroke="white" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
        Open file
      </label>
      <input type="file" id="fileInput" accept=".cbz,.zip" />
    </div>

    <div class="divider"></div>

    <!-- User chip + dropdown -->
    <div class="user-menu-wrap">
      <div class="user-chip" id="userChip">
        <div class="avatar" id="userAvatar">?</div>
        <span class="chip-name" id="userChipName">User</span>
        <svg width="10" height="10" viewBox="0 0 10 10" fill="none">
          <path d="M2 3.5l3 3 3-3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="user-menu" id="userMenu">
        <div class="user-menu-header">
          <div class="user-menu-name" id="menuName"></div>
          <div class="user-menu-email" id="menuEmail"></div>
        </div>
        <div class="user-menu-item" id="menuLibrary">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <rect x="1" y="2" width="3" height="10" rx="1" stroke="currentColor" stroke-width="1.3"/>
            <rect x="5.5" y="2" width="3" height="10" rx="1" stroke="currentColor" stroke-width="1.3"/>
            <rect x="10" y="2" width="3" height="10" rx="1" stroke="currentColor" stroke-width="1.3"/>
          </svg>
          My Library
        </div>
        <div class="user-menu-item danger" id="menuLogout">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <path d="M5 12H2a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1h3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
            <path d="M9.5 10l3-3-3-3M12.5 7H5.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Sign out
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ── READER ── -->
<div id="reader">
  <div class="state-wrapper" id="homeState">
    <div class="state-icon">📖</div>
    <div class="state-title">Welcome to CBZ Reader</div>
    <div class="state-sub">Sign in to access your library, or sign up to start saving your comics.</div>
  </div>
</div>

<!-- ── AUTH MODAL (Login / Signup) ── -->
<div class="modal-overlay" id="authModal">
  <div class="modal">
    <button class="modal-close" id="authModalClose">✕</button>
    <h2 id="authTitle">Sign in</h2>
    <p class="modal-sub" id="authSub">Welcome back. Pick up where you left off.</p>
    <div class="form-error" id="authError"></div>
    <div class="field" id="nameField" style="display:none">
      <label>Name</label>
      <input type="text" id="authName" placeholder="Your name" autocomplete="name" />
    </div>
    <div class="field">
      <label>Email</label>
      <input type="email" id="authEmail" placeholder="you@example.com" autocomplete="email" />
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="authPassword" placeholder="••••••••" autocomplete="current-password" />
    </div>
    <button class="btn-primary" id="authSubmit">Sign in</button>
    <div class="modal-switch" id="authSwitch">
      Don't have an account? <a id="authToggle">Sign up</a>
    </div>
  </div>
</div>

<!-- ── LIBRARY MODAL ── -->
<div class="modal-overlay" id="libModal">
  <div class="modal lib-modal">
    <button class="modal-close" id="libModalClose">✕</button>
    <div class="lib-header">
      <h2>My Library</h2>
      <div class="lib-actions">
        <div class="lib-upload-wrap">
          <label for="libFileInput">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
              <path d="M6 1v7M3.5 3.5l2.5-2.5 2.5 2.5" stroke="white" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M1 10h10" stroke="white" stroke-width="1.4" stroke-linecap="round"/>
            </svg>
            Add CBZ
          </label>
          <input type="file" id="libFileInput" accept=".cbz,.zip" />
        </div>
      </div>
    </div>

    <input type="text" class="lib-search" id="libSearch" placeholder="Search your library…" />

    <div class="lib-progress" id="libProgress">
      <span class="lib-progress-name" id="libProgressName"></span>
      <div class="lib-progress-bar-wrap"><div class="lib-progress-bar" id="libProgressBar"></div></div>
    </div>

    <div class="lib-grid" id="libGrid"></div>
  </div>
</div>

<!-- ── TOAST ── -->
<div class="toast" id="toast"><div class="toast-dot"></div><span id="toastMsg"></span></div>

<script>
// ═══════════════════════════════════════════════════════════
//  DB
// ═══════════════════════════════════════════════════════════
const DB_NAME = 'cbzreader', DB_VER = 1, STORE = 'comics';
let db;

function openDB() {
  return new Promise((res, rej) => {
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = e => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains(STORE))
        d.createObjectStore(STORE, { keyPath: 'id' });
    };
    req.onsuccess = e => { db = e.target.result; res(db); };
    req.onerror   = e => rej(e.target.error);
  });
}

function dbPut(record)  {
  return new Promise((res, rej) => {
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).put(record).onsuccess = () => res();
    tx.onerror = e => rej(e.target.error);
  });
}
function dbGetAll(user) {
  return new Promise((res, rej) => {
    const tx = db.transaction(STORE, 'readonly');
    const req = tx.objectStore(STORE).getAll();
    req.onsuccess = () => res(req.result.filter(r => r.user === user));
    req.onerror   = e => rej(e.target.error);
  });
}
function dbDelete(id) {
  return new Promise((res, rej) => {
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).delete(id).onsuccess = () => res();
    tx.onerror = e => rej(e.target.error);
  });
}
function dbGet(id) {
  return new Promise((res, rej) => {
    const tx = db.transaction(STORE, 'readonly');
    const req = tx.objectStore(STORE).get(id);
    req.onsuccess = () => res(req.result);
    req.onerror   = e => rej(e.target.error);
  });
}

// ═══════════════════════════════════════════════════════════
//  AUTH (localStorage)
// ═══════════════════════════════════════════════════════════
function getUsers()      { return JSON.parse(localStorage.getItem('cbz_users') || '{}'); }
function saveUsers(u)    { localStorage.setItem('cbz_users', JSON.stringify(u)); }
function getCurrentUser(){ return JSON.parse(localStorage.getItem('cbz_session') || 'null'); }
function setSession(u)   { localStorage.setItem('cbz_session', JSON.stringify(u)); }
function clearSession()  { localStorage.removeItem('cbz_session'); }

function hashPass(p) {
  // Simple deterministic hash (not cryptographic — fine for local-only storage)
  let h = 0x811c9dc5;
  for (let i = 0; i < p.length; i++) {
    h ^= p.charCodeAt(i);
    h = (h * 0x01000193) >>> 0;
  }
  return h.toString(16);
}

function signup(name, email, password) {
  const users = getUsers();
  if (users[email]) return { ok:false, error:'An account with this email already exists.' };
  users[email] = { name, email, hash: hashPass(password) };
  saveUsers(users);
  const user = { name, email };
  setSession(user);
  return { ok:true, user };
}

function login(email, password) {
  const users = getUsers();
  const u = users[email];
  if (!u) return { ok:false, error:'No account found with that email.' };
  if (u.hash !== hashPass(password)) return { ok:false, error:'Incorrect password.' };
  const user = { name: u.name, email };
  setSession(user);
  return { ok:true, user };
}

// ═══════════════════════════════════════════════════════════
//  TOAST
// ═══════════════════════════════════════════════════════════
let toastTimer;
function showToast(msg, type='success') {
  const t = document.getElementById('toast');
  t.className = `toast ${type}`;
  document.getElementById('toastMsg').textContent = msg;
  clearTimeout(toastTimer);
  requestAnimationFrame(() => {
    t.classList.add('show');
    toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
  });
}

// ═══════════════════════════════════════════════════════════
//  UI STATE
// ═══════════════════════════════════════════════════════════
let currentUser = null;
let zoomLevel   = 1;
let isSignup    = false;

function updateUI() {
  currentUser = getCurrentUser();
  const loggedIn = !!currentUser;
  document.getElementById('authArea').style.display   = loggedIn ? 'none' : 'flex';
  document.getElementById('loggedArea').style.display = loggedIn ? 'flex' : 'none';
  if (loggedIn) {
    const initials = currentUser.name.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);
    document.getElementById('userAvatar').textContent  = initials;
    document.getElementById('userChipName').textContent= currentUser.name.split(' ')[0];
    document.getElementById('menuName').textContent    = currentUser.name;
    document.getElementById('menuEmail').textContent   = currentUser.email;
  }
  // Update reader home state
  if (!document.querySelector('.page')) {
    document.getElementById('reader').innerHTML = loggedIn
      ? `<div class="state-wrapper"><div class="state-icon">📚</div>
         <div class="state-title">Your library is ready</div>
         <div class="state-sub">Open a file to start reading, or browse your saved comics in Library.</div></div>`
      : `<div class="state-wrapper"><div class="state-icon">📖</div>
         <div class="state-title">Welcome to CBZ Reader</div>
         <div class="state-sub">Sign in to access your library, or sign up to start saving your comics.</div></div>`;
  }
}

// ═══════════════════════════════════════════════════════════
//  AUTH MODAL
// ═══════════════════════════════════════════════════════════
function openAuthModal(signup=false) {
  isSignup = signup;
  setAuthMode(signup);
  document.getElementById('authEmail').value    = '';
  document.getElementById('authPassword').value = '';
  document.getElementById('authName').value     = '';
  document.getElementById('authError').classList.remove('show');
  openModal('authModal');
}
function setAuthMode(signup) {
  isSignup = signup;
  document.getElementById('authTitle').textContent  = signup ? 'Create account'     : 'Sign in';
  document.getElementById('authSub').textContent    = signup ? 'Start building your library.' : 'Welcome back. Pick up where you left off.';
  document.getElementById('authSubmit').textContent = signup ? 'Create account'     : 'Sign in';
  document.getElementById('nameField').style.display= signup ? 'flex' : 'none';
  document.getElementById('authToggle').textContent = signup ? 'Sign in'            : 'Sign up';
  document.getElementById('authSwitch').innerHTML   = signup
    ? `Already have an account? <a id="authToggle">Sign in</a>`
    : `Don't have an account? <a id="authToggle">Sign up</a>`;
  document.getElementById('authToggle').addEventListener('click', () => setAuthMode(!isSignup));
}

document.getElementById('showLoginBtn') .addEventListener('click', () => openAuthModal(false));
document.getElementById('showSignupBtn').addEventListener('click', () => openAuthModal(true));
document.getElementById('authModalClose').addEventListener('click', () => closeModal('authModal'));
document.getElementById('authToggle')   .addEventListener('click', () => setAuthMode(!isSignup));

document.getElementById('authSubmit').addEventListener('click', () => {
  const email    = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPassword').value;
  const name     = document.getElementById('authName').value.trim();
  const errEl    = document.getElementById('authError');
  errEl.classList.remove('show');

  if (!email || !password) { errEl.textContent='Please fill in all fields.'; errEl.classList.add('show'); return; }
  if (isSignup && !name)   { errEl.textContent='Please enter your name.';    errEl.classList.add('show'); return; }
  if (password.length < 6) { errEl.textContent='Password must be at least 6 characters.'; errEl.classList.add('show'); return; }

  const result = isSignup ? signup(name, email, password) : login(email, password);
  if (!result.ok) { errEl.textContent=result.error; errEl.classList.add('show'); return; }

  closeModal('authModal');
  updateUI();
  showToast(isSignup ? `Welcome, ${result.user.name}! 🎉` : `Welcome back, ${result.user.name}!`);
});

// Allow Enter to submit
['authEmail','authPassword','authName'].forEach(id => {
  document.getElementById(id).addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('authSubmit').click();
  });
});

// ═══════════════════════════════════════════════════════════
//  USER MENU
// ═══════════════════════════════════════════════════════════
document.getElementById('userChip').addEventListener('click', (e) => {
  e.stopPropagation();
  document.getElementById('userMenu').classList.toggle('open');
});
document.addEventListener('click', () => document.getElementById('userMenu').classList.remove('open'));

document.getElementById('menuLogout').addEventListener('click', () => {
  clearSession(); updateUI(); showToast('Signed out.', 'success');
  document.getElementById('zoomGroup').style.display   = 'none';
  document.getElementById('zoomDivider').style.display = 'none';
  document.getElementById('filename').textContent = '';
  document.getElementById('reader').innerHTML = `<div class="state-wrapper">
    <div class="state-icon">📖</div>
    <div class="state-title">Welcome to CBZ Reader</div>
    <div class="state-sub">Sign in to access your library, or sign up to start saving your comics.</div>
  </div>`;
});
document.getElementById('menuLibrary').addEventListener('click', () => {
  document.getElementById('userMenu').classList.remove('open');
  openLibraryModal();
});
document.getElementById('openLibBtn').addEventListener('click', openLibraryModal);

// ═══════════════════════════════════════════════════════════
//  LIBRARY MODAL
// ═══════════════════════════════════════════════════════════
async function openLibraryModal() {
  if (!currentUser) return;
  openModal('libModal');
  await renderLibrary();
}
document.getElementById('libModalClose').addEventListener('click', () => closeModal('libModal'));

document.getElementById('libSearch').addEventListener('input', async () => {
  await renderLibrary(document.getElementById('libSearch').value.trim().toLowerCase());
});

async function renderLibrary(filter='') {
  const grid = document.getElementById('libGrid');
  grid.innerHTML = `<div class="lib-empty"><div class="lib-empty-icon">⏳</div><div class="lib-empty-title">Loading…</div></div>`;
  let comics = await dbGetAll(currentUser.email);
  if (filter) comics = comics.filter(c => c.name.toLowerCase().includes(filter));

  if (comics.length === 0) {
    grid.innerHTML = `<div class="lib-empty">
      <div class="lib-empty-icon">📭</div>
      <div class="lib-empty-title">${filter ? 'No results' : 'Library is empty'}</div>
      <div class="lib-empty-sub">${filter ? 'Try a different search term.' : 'Add your first CBZ file using the button above.'}</div>
    </div>`;
    return;
  }

  grid.innerHTML = '';
  for (const comic of comics) {
    const card = document.createElement('div');
    card.className = 'lib-card';
    card.innerHTML = `
      <div class="lib-card-thumb">
        ${comic.cover ? `<img src="${comic.cover}" alt="cover" />` : '📚'}
      </div>
      <div class="lib-card-body">
        <div class="lib-card-name">${escHtml(comic.name)}</div>
        <div class="lib-card-meta">${formatBytes(comic.size)}</div>
      </div>
      <div class="lib-card-del" title="Remove from library">✕</div>
    `;
    card.querySelector('.lib-card-del').addEventListener('click', async (e) => {
      e.stopPropagation();
      await dbDelete(comic.id);
      showToast('Removed from library.', 'success');
      await renderLibrary(filter);
    });
    card.addEventListener('click', async () => {
      closeModal('libModal');
      await openComicFromDB(comic.id);
    });
    grid.appendChild(card);
  }
}

// ─── Add to library from library modal ───
document.getElementById('libFileInput').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  e.target.value = '';
  await saveToLibrary(file);
  await renderLibrary();
});

async function saveToLibrary(file) {
  if (!currentUser) return;
  const id = `${currentUser.email}::${file.name}::${file.lastModified}`;

  // Show progress
  const prog   = document.getElementById('libProgress');
  const bar    = document.getElementById('libProgressBar');
  const pName  = document.getElementById('libProgressName');
  pName.textContent = file.name;
  bar.style.width   = '0%';
  prog.classList.add('show');

  try {
    bar.style.width = '30%';
    // Extract first image as cover thumbnail
    let coverDataUrl = null;
    try {
      const zip = await JSZip.loadAsync(file);
      bar.style.width = '60%';
      const imgs = Object.keys(zip.files)
        .filter(n => /\.(jpg|jpeg|png|webp)$/i.test(n))
        .sort((a,b) => a.localeCompare(b, undefined, { numeric:true, sensitivity:'base' }));
      if (imgs.length > 0) {
        const blob = await zip.files[imgs[0]].async('blob');
        coverDataUrl = await blobToDataURL(blob, 200); // thumbnail
      }
    } catch(e) {}

    bar.style.width = '80%';

    const record = {
      id,
      user:  currentUser.email,
      name:  file.name,
      size:  file.size,
      added: Date.now(),
      cover: coverDataUrl,
      data:  await fileToArrayBuffer(file),
    };
    await dbPut(record);
    bar.style.width = '100%';
    setTimeout(() => prog.classList.remove('show'), 600);
    showToast(`"${file.name}" added to library.`);
  } catch(err) {
    prog.classList.remove('show');
    showToast('Failed to save file.', 'error');
    console.error(err);
  }
}

async function openComicFromDB(id) {
  const record = await dbGet(id);
  if (!record) { showToast('File not found.', 'error'); return; }

  const file = new File([record.data], record.name, { type: 'application/zip' });
  document.getElementById('filename').textContent = record.name;
  await loadCBZ(file);
}

// ═══════════════════════════════════════════════════════════
//  READER
// ═══════════════════════════════════════════════════════════
const readerEl = document.getElementById('reader');

const observer = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (e.isIntersecting) { e.target.classList.add('visible'); observer.unobserve(e.target); }
  });
}, { rootMargin: '200px' });

async function loadCBZ(file) {
  document.getElementById('zoomGroup').style.display   = 'flex';
  document.getElementById('zoomDivider').style.display = 'block';
  readerEl.innerHTML = `<div class="state-wrapper">
    <div class="state-icon">⏳</div>
    <div class="state-title">Loading…</div>
    <div class="loading-bar-wrap"><div class="loading-bar"></div></div>
  </div>`;

  try {
    const zip = await JSZip.loadAsync(file);
    const imageFiles = Object.keys(zip.files)
      .filter(n => /\.(jpg|jpeg|png|webp)$/i.test(n))
      .sort((a,b) => a.localeCompare(b, undefined, { numeric:true, sensitivity:'base' }));

    if (imageFiles.length === 0) {
      readerEl.innerHTML = `<div class="state-wrapper">
        <div class="state-icon">🔍</div>
        <div class="state-title">No images found</div>
        <div class="state-sub">This archive doesn't contain any JPG, PNG, or WebP images.</div>
      </div>`; return;
    }

    readerEl.innerHTML = '';
    for (const name of imageFiles) {
      const blob = await zip.files[name].async('blob');
      const url  = URL.createObjectURL(blob);
      const img  = document.createElement('img');
      img.src = url; img.className = 'page'; img.loading = 'lazy'; img.alt = name;
      readerEl.appendChild(img);
      observer.observe(img);
    }
    applyZoom();
  } catch(err) {
    console.error(err);
    readerEl.innerHTML = `<div class="state-wrapper">
      <div class="state-icon">⚠️</div>
      <div class="state-title">Couldn't open file</div>
      <div class="state-sub">Make sure the file is a valid CBZ or ZIP archive and try again.</div>
    </div>`;
  }
}

// File input (topbar Open file button)
document.getElementById('fileInput').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file || !currentUser) return;
  e.target.value = '';
  document.getElementById('filename').textContent = file.name;
  // Save to library in background, then open
  saveToLibrary(file); // fire-and-forget, don't await UI blocking
  await loadCBZ(file);
});

// ═══════════════════════════════════════════════════════════
//  ZOOM
// ═══════════════════════════════════════════════════════════
function applyZoom() {
  document.querySelectorAll('.page').forEach(img => img.style.width = `${zoomLevel*100}%`);
  document.getElementById('zoomReset').textContent = `${Math.round(zoomLevel*100)}%`;
}
document.getElementById('zoomIn')   .addEventListener('click', () => { zoomLevel=Math.min(3,zoomLevel+.1); applyZoom(); });
document.getElementById('zoomOut')  .addEventListener('click', () => { zoomLevel=Math.max(.2,zoomLevel-.1); applyZoom(); });
document.getElementById('zoomReset').addEventListener('click', () => { zoomLevel=1; applyZoom(); });
window.addEventListener('wheel', e => {
  if (!e.ctrlKey) return; e.preventDefault();
  zoomLevel = e.deltaY<0 ? Math.min(3,zoomLevel+.05) : Math.max(.2,zoomLevel-.05);
  applyZoom();
}, { passive:false });

// ═══════════════════════════════════════════════════════════
//  TOPBAR HIDE ON SCROLL
// ═══════════════════════════════════════════════════════════
let lastY=0;
window.addEventListener('scroll', () => {
  const y = window.scrollY;
  document.getElementById('topbar').classList.toggle('hidden', y>80 && y>lastY);
  lastY=y;
});

// ═══════════════════════════════════════════════════════════
//  MODAL HELPERS
// ═══════════════════════════════════════════════════════════
function openModal(id)  { document.getElementById(id).classList.add('open');  }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
document.querySelectorAll('.modal-overlay').forEach(el => {
  el.addEventListener('click', e => { if (e.target===el) closeModal(el.id); });
});
document.addEventListener('keydown', e => {
  if (e.key==='Escape') document.querySelectorAll('.modal-overlay.open').forEach(el => closeModal(el.id));
});

// ═══════════════════════════════════════════════════════════
//  UTILS
// ═══════════════════════════════════════════════════════════
function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function formatBytes(b) {
  if (b<1024)       return b+'B';
  if (b<1048576)    return (b/1024).toFixed(1)+'KB';
  return (b/1048576).toFixed(1)+'MB';
}
function fileToArrayBuffer(file) {
  return new Promise((res,rej) => {
    const fr = new FileReader();
    fr.onload  = () => res(fr.result);
    fr.onerror = () => rej(fr.error);
    fr.readAsArrayBuffer(file);
  });
}
function blobToDataURL(blob, maxSize=200) {
  return new Promise((res) => {
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(maxSize/img.width, maxSize*1.5/img.height, 1);
        const canvas = document.createElement('canvas');
        canvas.width  = img.width  * scale;
        canvas.height = img.height * scale;
        canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
        res(canvas.toDataURL('image/jpeg', .7));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(blob);
  });
}

// ═══════════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════════
openDB().then(updateUI).catch(err => {
  console.error('IndexedDB failed:', err);
  showToast('Storage unavailable. Files won\'t be saved.', 'error');
  updateUI();
});
</script>
