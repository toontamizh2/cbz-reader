<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CBZ Reader</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg:          #0a0a0f;
      --surface:     #13131a;
      --surface2:    #1a1a24;
      --surface3:    #20202e;
      --border:      #1e1e2e;
      --border2:     #2a2a3e;
      --accent:      #7c6bff;
      --accent-dim:  rgba(124,107,255,0.15);
      --accent-glow: rgba(124,107,255,0.35);
      --danger:      #ff5f5f;
      --success:     #4ade80;
      --text:        #e8e6f0;
      --text-muted:  #6b6880;
      --text-faint:  #3a3850;
      --radius:      10px;
      --radius-lg:   16px;
    }
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    body {
      background:var(--bg); color:var(--text);
      font-family:'Inter',sans-serif; overflow-x:hidden; min-height:100vh;
    }

    /* ── TOPBAR ── */
    .topbar {
      position:fixed; top:0; left:0; width:100%; z-index:1000;
      background:rgba(10,10,15,0.88);
      backdrop-filter:blur(20px) saturate(160%);
      -webkit-backdrop-filter:blur(20px) saturate(160%);
      box-shadow:0 1px 0 0 var(--border), 0 4px 30px rgba(0,0,0,.5);
      padding:0 20px; height:58px;
      display:flex; align-items:center; gap:8px;
      transition:transform .35s cubic-bezier(.4,0,.2,1), opacity .35s ease;
    }
    .topbar.hidden { transform:translateY(-100%); opacity:0; }
    .brand { display:flex; align-items:center; gap:10px; cursor:pointer; }
    .brand-icon {
      width:30px; height:30px; background:var(--accent-dim);
      border:1px solid var(--accent-glow); border-radius:8px;
      display:flex; align-items:center; justify-content:center; color:var(--accent);
    }
    .brand-name { font-size:15px; font-weight:600; letter-spacing:-.01em; }
    .filename {
      font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--text-muted);
      max-width:200px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    }
    .topbar-spacer { flex:1; }
    .divider { width:1px; height:24px; background:var(--border); margin:0 4px; flex-shrink:0; }

    /* Zoom */
    .zoom-group {
      display:flex; align-items:center; gap:2px;
      background:var(--surface); border:1px solid var(--border);
      border-radius:var(--radius); padding:3px;
    }
    .zoom-group button {
      background:transparent; border:none; color:var(--text-muted);
      width:30px; height:30px; border-radius:7px; cursor:pointer; font-size:16px;
      font-family:'Inter',sans-serif; display:flex; align-items:center;
      justify-content:center; transition:background .15s,color .15s; padding:0;
    }
    .zoom-group button:hover { background:var(--surface2); color:var(--text); }
    #zoomReset {
      font-size:12px !important; font-weight:500;
      font-family:'JetBrains Mono',monospace !important;
      width:52px !important; color:var(--text) !important; letter-spacing:-.03em;
    }

    /* Buttons */
    .btn-ghost {
      display:flex; align-items:center; gap:6px;
      background:var(--surface); border:1px solid var(--border2);
      color:var(--text); padding:7px 14px; border-radius:var(--radius);
      cursor:pointer; font-size:13px; font-weight:500; font-family:'Inter',sans-serif;
      transition:background .2s,border-color .2s; white-space:nowrap;
    }
    .btn-ghost:hover { background:var(--surface2); border-color:var(--accent); }
    .btn-accent {
      display:flex; align-items:center; gap:7px;
      background:var(--accent); color:#fff; padding:7px 14px;
      border-radius:var(--radius); cursor:pointer; font-size:13px; font-weight:500;
      font-family:'Inter',sans-serif; border:none;
      transition:background .2s,box-shadow .2s; white-space:nowrap;
    }
    .btn-accent:hover { background:#8d7dff; box-shadow:0 0 16px var(--accent-glow); }

    /* Upload wrap */
    .upload-wrap { position:relative; overflow:hidden; }
    .upload-wrap label {
      display:flex; align-items:center; gap:7px; background:var(--accent);
      color:#fff; padding:7px 14px; border-radius:var(--radius); cursor:pointer;
      font-size:13px; font-weight:500; font-family:'Inter',sans-serif;
      transition:background .2s,box-shadow .2s; white-space:nowrap;
    }
    .upload-wrap label:hover { background:#8d7dff; box-shadow:0 0 16px var(--accent-glow); }
    .upload-wrap input { position:absolute; inset:0; opacity:0; cursor:pointer; font-size:0; }

    /* User chip */
    .user-chip {
      display:flex; align-items:center; gap:8px; background:var(--surface);
      border:1px solid var(--border2); border-radius:var(--radius);
      padding:5px 10px; cursor:pointer; transition:background .2s;
    }
    .user-chip:hover { background:var(--surface2); }
    .avatar {
      width:24px; height:24px; border-radius:50%; background:var(--accent-dim);
      border:1px solid var(--accent-glow); display:flex; align-items:center;
      justify-content:center; font-size:11px; font-weight:600; color:var(--accent);
    }
    .chip-name { font-size:13px; font-weight:500; max-width:100px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

    /* User menu */
    .user-menu-wrap { position:relative; }
    .user-menu {
      position:absolute; top:calc(100% + 8px); right:0;
      background:var(--surface); border:1px solid var(--border2);
      border-radius:var(--radius); min-width:190px;
      box-shadow:0 12px 40px rgba(0,0,0,.5); z-index:1100; overflow:hidden;
      opacity:0; pointer-events:none; transform:translateY(-4px);
      transition:opacity .15s,transform .15s;
    }
    .user-menu.open { opacity:1; pointer-events:all; transform:translateY(0); }
    .user-menu-header { padding:12px 14px 10px; border-bottom:1px solid var(--border); }
    .user-menu-name { font-size:13px; font-weight:600; }
    .user-menu-email { font-size:11px; color:var(--text-muted); margin-top:2px; font-family:'JetBrains Mono',monospace; }
    .user-menu-item {
      display:flex; align-items:center; gap:10px; padding:10px 14px;
      cursor:pointer; font-size:13px; transition:background .15s; color:var(--text-muted);
    }
    .user-menu-item:hover { background:var(--surface2); color:var(--text); }
    .user-menu-item.danger { color:var(--danger); }
    .user-menu-item.danger:hover { background:rgba(255,95,95,.1); }

    /* ── READER ── */
    #reader { width:100%; margin-top:58px; }
    .page { width:100%; display:block; margin:0 auto; transition:width .15s ease; opacity:0; }
    .page.visible { animation:fadeIn .4s ease forwards; }
    img { display:block; height:auto; }
    @keyframes fadeIn {
      from { opacity:0; transform:translateY(6px); }
      to   { opacity:1; transform:translateY(0); }
    }

    /* ── STATES ── */
    .state-wrapper {
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      min-height:calc(100vh - 58px); gap:16px; padding:40px 20px; color:var(--text-muted);
    }
    .state-icon {
      width:64px; height:64px; background:var(--surface); border:1px solid var(--border);
      border-radius:18px; display:flex; align-items:center; justify-content:center;
      font-size:28px; margin-bottom:4px;
    }
    .state-title { font-size:16px; font-weight:600; color:var(--text); letter-spacing:-.01em; }
    .state-sub { font-size:13px; color:var(--text-muted); text-align:center; max-width:280px; line-height:1.6; }
    .loading-bar-wrap { width:200px; height:3px; background:var(--surface2); border-radius:99px; overflow:hidden; }
    .loading-bar { height:100%; width:40%; background:var(--accent); border-radius:99px; animation:slide 1.2s ease-in-out infinite; }
    @keyframes slide { 0%{transform:translateX(-100%)} 100%{transform:translateX(600%)} }

    /* ── MODAL ── */
    .modal-overlay {
      position:fixed; inset:0; z-index:2000;
      background:rgba(0,0,0,.75); backdrop-filter:blur(6px);
      display:flex; align-items:center; justify-content:center;
      padding:20px; opacity:0; pointer-events:none; transition:opacity .25s ease;
    }
    .modal-overlay.open { opacity:1; pointer-events:all; }
    .modal {
      background:var(--surface); border:1px solid var(--border2);
      border-radius:var(--radius-lg); width:100%; max-width:420px; padding:32px;
      position:relative; transform:translateY(12px); transition:transform .25s ease;
      box-shadow:0 24px 80px rgba(0,0,0,.6);
    }
    .modal-overlay.open .modal { transform:translateY(0); }
    .modal-close {
      position:absolute; top:14px; right:14px; background:transparent; border:none;
      color:var(--text-muted); width:30px; height:30px; border-radius:8px;
      cursor:pointer; font-size:18px; display:flex; align-items:center;
      justify-content:center; transition:background .15s,color .15s;
    }
    .modal-close:hover { background:var(--surface2); color:var(--text); }
    .modal h2 { font-size:20px; font-weight:600; letter-spacing:-.02em; margin-bottom:6px; }
    .modal-sub { font-size:13px; color:var(--text-muted); margin-bottom:24px; line-height:1.5; }

    /* Form */
    .field { display:flex; flex-direction:column; gap:6px; margin-bottom:16px; }
    .field label { font-size:12px; font-weight:500; color:var(--text-muted); letter-spacing:.02em; text-transform:uppercase; }
    .field input {
      background:var(--surface2); border:1px solid var(--border2);
      border-radius:var(--radius); padding:10px 14px; color:var(--text);
      font-size:14px; font-family:'Inter',sans-serif; outline:none;
      transition:border-color .2s,box-shadow .2s; width:100%;
    }
    .field input:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-dim); }
    .field input::placeholder { color:var(--text-faint); }
    .btn-primary {
      width:100%; background:var(--accent); color:#fff; border:none;
      border-radius:var(--radius); padding:11px; font-size:14px; font-weight:600;
      cursor:pointer; font-family:'Inter',sans-serif;
      transition:background .2s,box-shadow .2s; margin-top:4px;
      display:flex; align-items:center; justify-content:center; gap:8px;
    }
    .btn-primary:hover:not(:disabled) { background:#8d7dff; box-shadow:0 0 20px var(--accent-glow); }
    .btn-primary:disabled { opacity:.5; cursor:not-allowed; }
    .modal-switch { margin-top:16px; text-align:center; font-size:13px; color:var(--text-muted); }
    .modal-switch a { color:var(--accent); cursor:pointer; text-decoration:none; font-weight:500; }
    .modal-switch a:hover { text-decoration:underline; }
    .form-error {
      background:rgba(255,95,95,.12); border:1px solid rgba(255,95,95,.3);
      color:var(--danger); border-radius:8px; padding:10px 14px;
      font-size:13px; margin-bottom:14px; display:none;
    }
    .form-error.show { display:block; }
    .form-info {
      background:rgba(124,107,255,.1); border:1px solid rgba(124,107,255,.25);
      color:#a89fff; border-radius:8px; padding:10px 14px;
      font-size:13px; margin-bottom:14px; display:none;
    }
    .form-info.show { display:block; }

    /* ── LIBRARY MODAL ── */
    .lib-modal { max-width:700px; padding:28px; }
    .lib-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; }
    .lib-header h2 { font-size:18px; font-weight:600; letter-spacing:-.02em; }
    .lib-search {
      width:100%; background:var(--surface2); border:1px solid var(--border2);
      border-radius:var(--radius); padding:9px 14px; color:var(--text);
      font-size:13px; font-family:'Inter',sans-serif; outline:none;
      transition:border-color .2s; margin-bottom:16px;
    }
    .lib-search:focus { border-color:var(--accent); }
    .lib-search::placeholder { color:var(--text-faint); }

    /* Upload progress */
    .lib-progress {
      background:var(--surface3); border:1px solid var(--border2);
      border-radius:var(--radius); padding:12px 16px; margin-bottom:14px;
      display:none; gap:12px; align-items:center; flex-wrap:wrap;
    }
    .lib-progress.show { display:flex; }
    .lib-progress-info { flex:1; min-width:0; }
    .lib-progress-name { font-size:13px; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .lib-progress-status { font-size:11px; color:var(--text-muted); margin-top:3px; font-family:'JetBrains Mono',monospace; }
    .lib-progress-bar-wrap { width:100%; height:3px; background:var(--surface2); border-radius:99px; overflow:hidden; margin-top:8px; }
    .lib-progress-bar { height:100%; background:var(--accent); border-radius:99px; width:0%; transition:width .3s ease; }

    /* Grid */
    .lib-grid {
      display:grid; grid-template-columns:repeat(auto-fill, minmax(140px,1fr));
      gap:12px; max-height:420px; overflow-y:auto; padding-right:4px;
    }
    .lib-grid::-webkit-scrollbar { width:4px; }
    .lib-grid::-webkit-scrollbar-track { background:transparent; }
    .lib-grid::-webkit-scrollbar-thumb { background:var(--border2); border-radius:99px; }
    .lib-card {
      background:var(--surface2); border:1px solid var(--border);
      border-radius:var(--radius); overflow:hidden; cursor:pointer;
      transition:border-color .2s,transform .15s,box-shadow .2s; position:relative;
    }
    .lib-card:hover { border-color:var(--accent); transform:translateY(-2px); box-shadow:0 8px 24px rgba(0,0,0,.4); }
    .lib-card-thumb {
      width:100%; aspect-ratio:2/3; background:var(--surface3);
      display:flex; align-items:center; justify-content:center; font-size:32px;
    }
    .lib-card-thumb img { width:100%; height:100%; object-fit:cover; }
    .lib-card-body { padding:10px; }
    .lib-card-name {
      font-size:12px; font-weight:500; line-height:1.4; overflow:hidden;
      display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; color:var(--text);
    }
    .lib-card-meta { font-size:11px; color:var(--text-muted); margin-top:4px; font-family:'JetBrains Mono',monospace; }
    .lib-card-del {
      position:absolute; top:6px; right:6px; background:rgba(10,10,15,.8);
      border:1px solid var(--border2); border-radius:6px; width:26px; height:26px;
      display:flex; align-items:center; justify-content:center; cursor:pointer;
      opacity:0; transition:opacity .15s,background .15s; color:var(--text-muted); font-size:14px;
    }
    .lib-card:hover .lib-card-del { opacity:1; }
    .lib-card-del:hover { background:rgba(255,95,95,.2); color:var(--danger); border-color:var(--danger); }
    .lib-empty {
      grid-column:1/-1; display:flex; flex-direction:column; align-items:center;
      gap:12px; padding:48px 20px; color:var(--text-muted); text-align:center;
    }
    .lib-empty-icon { font-size:36px; }
    .lib-empty-title { font-size:15px; font-weight:600; color:var(--text); }
    .lib-empty-sub { font-size:13px; max-width:220px; line-height:1.6; }

    /* Upload progress inside lib */
    .upload-lib-wrap { position:relative; overflow:hidden; }
    .upload-lib-wrap label {
      display:flex; align-items:center; gap:6px; background:var(--accent); color:#fff;
      padding:7px 14px; border-radius:var(--radius); cursor:pointer; font-size:13px;
      font-weight:500; transition:background .2s; white-space:nowrap;
    }
    .upload-lib-wrap label:hover { background:#8d7dff; }
    .upload-lib-wrap input { position:absolute; inset:0; opacity:0; cursor:pointer; font-size:0; }
    .upload-lib-wrap.disabled label { opacity:.5; cursor:not-allowed; pointer-events:none; }

    /* Spinner */
    .spinner {
      width:14px; height:14px; border:2px solid rgba(255,255,255,.25);
      border-top-color:#fff; border-radius:50%; animation:spin .7s linear infinite; flex-shrink:0;
    }
    @keyframes spin { to { transform:rotate(360deg); } }

    /* Toast */
    .toast {
      position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(8px);
      background:var(--surface); border:1px solid var(--border2); border-radius:var(--radius);
      padding:10px 18px; font-size:13px; font-weight:500; z-index:3000;
      box-shadow:0 8px 32px rgba(0,0,0,.4); opacity:0; pointer-events:none;
      transition:opacity .25s,transform .25s;
      display:flex; align-items:center; gap:8px; white-space:nowrap;
    }
    .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
    .toast-dot { width:7px; height:7px; border-radius:50%; flex-shrink:0; }
    .toast.success .toast-dot { background:var(--success); }
    .toast.error   .toast-dot { background:var(--danger); }
    .toast.info    .toast-dot { background:var(--accent); }
  </style>
</head>
<body>

<!-- ── TOPBAR ── -->
<div class="topbar" id="topbar">
  <div class="brand" id="brandHome">
    <div class="brand-icon">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <rect x="2" y="1" width="8" height="12" rx="1.5" stroke="currentColor" stroke-width="1.4"/>
        <path d="M10 3h2.5a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H10" stroke="currentColor" stroke-width="1.4"/>
        <line x1="4.5" y1="4.5" x2="7.5" y2="4.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
        <line x1="4.5" y1="6.5" x2="7.5" y2="6.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
      </svg>
    </div>
    <span class="brand-name">CBZ Reader</span>
  </div>

  <span class="filename" id="filename"></span>
  <div class="topbar-spacer"></div>

  <div class="zoom-group" id="zoomGroup" style="display:none">
    <button id="zoomOut" title="Zoom out">−</button>
    <button id="zoomReset" title="Reset zoom">100%</button>
    <button id="zoomIn" title="Zoom in">+</button>
  </div>
  <div class="divider" id="zoomDivider" style="display:none"></div>

  <!-- Logged-out -->
  <div id="authArea" style="display:flex;gap:8px;align-items:center;">
    <button class="btn-ghost" id="showLoginBtn">Sign in</button>
    <button class="btn-accent" id="showSignupBtn">Sign up free</button>
  </div>

  <!-- Logged-in -->
  <div id="loggedArea" style="display:none;gap:8px;align-items:center;">
    <button class="btn-ghost" id="openLibBtn">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
        <rect x="1" y="2" width="3" height="10" rx="1" stroke="currentColor" stroke-width="1.3"/>
        <rect x="5.5" y="2" width="3" height="10" rx="1" stroke="currentColor" stroke-width="1.3"/>
        <rect x="10" y="2" width="3" height="10" rx="1" stroke="currentColor" stroke-width="1.3"/>
      </svg>
      Library
    </button>
    <div class="divider"></div>
    <div class="upload-wrap">
      <label for="fileInput">
        <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
          <path d="M6.5 1v8M3.5 4l3-3 3 3" stroke="white" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M1 10.5h11" stroke="white" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
        Open file
      </label>
      <input type="file" id="fileInput" accept=".cbz,.zip" />
    </div>
    <div class="divider"></div>
    <div class="user-menu-wrap">
      <div class="user-chip" id="userChip">
        <div class="avatar" id="userAvatar">?</div>
        <span class="chip-name" id="userChipName">User</span>
        <svg width="10" height="10" viewBox="0 0 10 10" fill="none">
          <path d="M2 3.5l3 3 3-3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="user-menu" id="userMenu">
        <div class="user-menu-header">
          <div class="user-menu-name" id="menuName"></div>
          <div class="user-menu-email" id="menuEmail"></div>
        </div>
        <div class="user-menu-item" id="menuLibrary">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <rect x="1" y="2" width="3" height="10" rx="1" stroke="currentColor" stroke-width="1.3"/>
            <rect x="5.5" y="2" width="3" height="10" rx="1" stroke="currentColor" stroke-width="1.3"/>
            <rect x="10" y="2" width="3" height="10" rx="1" stroke="currentColor" stroke-width="1.3"/>
          </svg>
          My Library
        </div>
        <div class="user-menu-item danger" id="menuLogout">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <path d="M5 12H2a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1h3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
            <path d="M9.5 10l3-3-3-3M12.5 7H5.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Sign out
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ── READER ── -->
<div id="reader">
  <div class="state-wrapper">
    <div class="state-icon">📖</div>
    <div class="state-title">Welcome to CBZ Reader</div>
    <div class="state-sub">Sign in or create an account to build your personal cloud library.</div>
  </div>
</div>

<!-- ── AUTH MODAL ── -->
<div class="modal-overlay" id="authModal">
  <div class="modal">
    <button class="modal-close" id="authModalClose">✕</button>
    <h2 id="authTitle">Sign in</h2>
    <p class="modal-sub" id="authSub">Welcome back. Your library is waiting.</p>
    <div class="form-error" id="authError"></div>
    <div class="form-info"  id="authInfo"></div>
    <div class="field" id="nameField" style="display:none">
      <label>Name</label>
      <input type="text" id="authName" placeholder="Your name" autocomplete="name"/>

<script>

// ═══════════════════════════════════════════════════════════
const SUPABASE_URL = 'https://jimjjtrmislwdleueeyb.supabase.co';
const SUPABASE_KEY = 'sb_publishable_yGE7cI31ZF26t_J2eye80A_VAs9DqBk';

// ═══════════════════════════════════════════════════════════

let toastTimer;
function showToast(msg, type='success') {
  const t = document.getElementById('toast');
  t.className = `toast ${type}`;
  document.getElementById('toastMsg').textContent = msg;
  clearTimeout(toastTimer);
  t.classList.add('show');

// ═══════════════════════════════════════════════════════════
//  UI STATE
// ═══════════════════════════════════════════════════════════
let currentUser = null;
let zoomLevel   = 1;
let isSignup    = false;

function setLoggedIn(user) {
  currentUser = user;
  const loggedIn = !!user;
  document.getElementById('authArea').style.display    = loggedIn ? 'none'  : 'flex';
  document.getElementById('loggedArea').style.display  = loggedIn ? 'flex'  : 'none';
  if (loggedIn) {
    const email    = user.email || '';
    const name     = user.user_metadata?.name || email.split('@')[0] || 'User';
    const initials = name.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);
    document.getElementById('userAvatar').textContent   = initials;
    document.getElementById('userChipName').textContent = name.split(' ')[0];
    document.getElementById('menuName').textContent     = name;
    document.getElementById('menuEmail').textContent    = email;
  }
  if (!document.querySelector('.page')) showHomeState(loggedIn);
}

function showHomeState(loggedIn) {
  document.getElementById('reader').innerHTML = loggedIn
    ? `<div class="state-wrapper"><div class="state-icon">📚</div>
       <div class="state-title">Your library is ready</div>
       <div class="state-sub">Open a CBZ file to read it — it'll be saved to your cloud library automatically.</div></div>`
    : `<div class="state-wrapper"><div class="state-icon">📖</div>
       <div class="state-title">Welcome to CBZ Reader</div>
       <div class="state-sub">Sign in or create an account to build your personal cloud library.</div></div>`;
}

// ═══════════════════════════════════════════════════════════
//  AUTH
// ═══════════════════════════════════════════════════════════
function openAuthModal(signup=false) {
  setAuthMode(signup);
  ['authEmail','authPassword','authName'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('authError').classList.remove('show');
  document.getElementById('authInfo').classList.remove('show');
  openModal('authModal');
  setTimeout(() => document.getElementById('authEmail').focus(), 300);
}

function setAuthMode(signup) {
  isSignup = signup;
  document.getElementById('authTitle').textContent   = signup ? 'Create account'      : 'Sign in';
  document.getElementById('authSub').textContent     = signup ? 'Start building your cloud library.' : 'Welcome back. Your library is waiting.';
  document.getElementById('authSubmit').innerHTML    = signup ? 'Create account'      : 'Sign in';
  document.getElementById('nameField').style.display = signup ? 'flex'               : 'none';
  document.getElementById('authError').classList.remove('show');
  document.getElementById('authInfo').classList.remove('show');
  const sw = document.getElementById('authSwitch');
  sw.innerHTML = signup
    ? `Already have an account? <a id="authToggle">Sign in</a>`
    : `Don't have an account? <a id="authToggle">Sign up free</a>`;
  document.getElementById('authToggle').addEventListener('click', () => setAuthMode(!isSignup));
}

document.getElementById('showLoginBtn') .addEventListener('click', () => openAuthModal(false));
document.getElementById('showSignupBtn').addEventListener('click', () => openAuthModal(true));
document.getElementById('authModalClose').addEventListener('click', () => closeModal('authModal'));
document.getElementById('authToggle')   .addEventListener('click', () => setAuthMode(!isSignup));

document.getElementById('authSubmit').addEventListener('click', async () => {
  const email    = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPassword').value;
  const name     = document.getElementById('authName').value.trim();
  const errEl    = document.getElementById('authError');
  const infoEl   = document.getElementById('authInfo');
  const btn      = document.getElementById('authSubmit');
  errEl.classList.remove('show');
  infoEl.classList.remove('show');

  if (!email || !password)       { errEl.textContent='Please fill in all fields.'; errEl.classList.add('show'); return; }
  if (isSignup && !name)         { errEl.textContent='Please enter your name.';    errEl.classList.add('show'); return; }
  if (password.length < 6)       { errEl.textContent='Password must be at least 6 characters.'; errEl.classList.add('show'); return; }

  btn.disabled = true;
  btn.innerHTML = `<div class="spinner"></div> ${isSignup ? 'Creating account…' : 'Signing in…'}`;

  try {
    if (isSignup) {
      const { data, error } = await sb.auth.signUp({
        email, password,
        options: { data: { name } }
      });
      if (error) throw error;
      // Supabase may require email confirmation
      if (data.user && !data.session) {
        infoEl.textContent = '✉️ Check your email to confirm your account, then sign in.';
        infoEl.classList.add('show');
        btn.innerHTML = 'Create account';
        btn.disabled  = false;
        setAuthMode(false);
        return;
      }
      closeModal('authModal');
      setLoggedIn(data.user);
      showToast(`Welcome, ${name}! 🎉`);
    } else {
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if (error) throw error;
      closeModal('authModal');
      setLoggedIn(data.user);
      const displayName = data.user.user_metadata?.name || data.user.email.split('@')[0];
      showToast(`Welcome back, ${displayName}!`);
    }
  } catch(err) {
    errEl.textContent = err.message || 'Something went wrong. Please try again.';
    errEl.classList.add('show');
  } finally {
    btn.disabled = false;
    btn.innerHTML = isSignup ? 'Create account' : 'Sign in';
  }
});

['authEmail','authPassword','authName'].forEach(id => {
  document.getElementById(id).addEventListener('keydown', e => {
    if (e.key==='Enter') document.getElementById('authSubmit').click();

async function openLibraryModal() {
  if (!currentUser) return;
  openModal('libModal');
  document.getElementById('libSearch').value = '';
  await renderLibrary();
}
document.getElementById('libModalClose').addEventListener('click', () => closeModal('libModal'));
document.getElementById('libSearch').addEventListener('input', async () => {
  await renderLibrary(document.getElementById('libSearch').value.trim().toLowerCase());
});

async function renderLibrary(filter='') {
  const grid = document.getElementById('libGrid');
  grid.innerHTML = `<div class="lib-empty"><div class="lib-empty-icon">⏳</div><div class="lib-empty-title">Loading…</div></div>`;

  const { data: comics, error } = await sb
    .from('library')
    .select('*')
    .order('added_at', { ascending: false });

  if (error) {
    grid.innerHTML = `<div class="lib-empty"><div class="lib-empty-icon">⚠️</div><div class="lib-empty-title">Couldn't load library</div><div class="lib-empty-sub">${escHtml(error.message)}</div></div>`;
    return;
  }

  const filtered = filter ? comics.filter(c => c.name.toLowerCase().includes(filter)) : comics;

  if (filtered.length === 0) {
    grid.innerHTML = `<div class="lib-empty">
      <div class="lib-empty-icon">${filter ? '🔍' : '📭'}</div>
      <div class="lib-empty-title">${filter ? 'No results' : 'Library is empty'}</div>
      <div class="lib-empty-sub">${filter ? 'Try a different search.' : 'Upload your first CBZ file using the button above.'}</div>
    </div>`; return;
  }

  grid.innerHTML = '';
  for (const comic of filtered) {
    const card = document.createElement('div');
    card.className = 'lib-card';
    card.innerHTML = `
      <div class="lib-card-thumb">
        ${comic.cover_url ? `<img src="${escHtml(comic.cover_url)}" alt="cover"/>` : '📚'}
      </div>
      <div class="lib-card-body">
        <div class="lib-card-name">${escHtml(comic.name)}</div>
        <div class="lib-card-meta">${formatBytes(comic.size)}</div>
      </div>
      <div class="lib-card-del" title="Remove">✕</div>`;

    card.querySelector('.lib-card-del').addEventListener('click', async e => {
      e.stopPropagation();
      if (!confirm(`Remove "${comic.name}" from your library?`)) return;
      // Delete file from storage
      await sb.storage.from(BUCKET).remove([comic.storage_path]);
      // Delete cover if stored
      if (comic.cover_path) await sb.storage.from(BUCKET).remove([comic.cover_path]);
      // Delete DB row
      await sb.from('library').delete().eq('id', comic.id);
      showToast('Removed from library.');
      await renderLibrary(filter);
    });

    card.addEventListener('click', async () => {
      closeModal('libModal');
      await openComicFromCloud(comic);
    });
    grid.appendChild(card);
  }
}

async function uploadToCloud(file) {
  if (!currentUser) return;
  const prog      = document.getElementById('libProgress');
  const bar       = document.getElementById('libProgressBar');
  const pName     = document.getElementById('libProgressName');
  const pStatus   = document.getElementById('libProgressStatus');
  const uploadWrap= document.getElementById('libUploadWrap');

  pName.textContent   = file.name;
  pStatus.textContent = 'Extracting cover…';
  bar.style.width     = '0%';
  prog.classList.add('show');
  uploadWrap.classList.add('disabled');

  try {
    // Step 1: extract cover thumbnail
    let coverUrl  = null;
    let coverPath = null;
    bar.style.width = '10%';
    try {
      const zip  = await JSZip.loadAsync(file);
      const imgs = Object.keys(zip.files)
        .filter(n => /\.(jpg|jpeg|png|webp)$/i.test(n))
        .sort((a,b) => a.localeCompare(b, undefined, { numeric:true, sensitivity:'base' }));
      if (imgs.length > 0) {
        const blob      = await zip.files[imgs[0]].async('blob');
        const thumbBlob = await resizeBlob(blob, 300);
        const thumbPath = `${currentUser.id}/covers/${Date.now()}_cover.jpg`;
        const { error: uploadErr } = await sb.storage.from(BUCKET).upload(thumbPath, thumbBlob, { contentType:'image/jpeg', upsert:true });
        if (!uploadErr) {
          coverPath = thumbPath;
          const { data: urlData } = sb.storage.from(BUCKET).getPublicUrl(thumbPath);
          coverUrl = urlData?.publicUrl || null;
          // If bucket is private use signed URL instead
          if (!coverUrl) {
            const { data: signed } = await sb.storage.from(BUCKET).createSignedUrl(thumbPath, 60*60*24*365);
            coverUrl = signed?.signedUrl || null;
          }
        }
      }
    } catch(e) { /* cover extraction failed silently */ }

    bar.style.width     = '30%';
    pStatus.textContent = 'Uploading file…';

    // Step 2: upload CBZ
    const storagePath = `${currentUser.id}/comics/${Date.now()}_${file.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;
    const { error: uploadErr } = await sb.storage.from(BUCKET).upload(storagePath, file, {
      contentType: 'application/zip',
      upsert: false,
    });
    if (uploadErr) throw uploadErr;

    bar.style.width = '85%';
    pStatus.textContent = 'Saving to library…';

    // Step 3: insert DB record
    const { error: dbErr } = await sb.from('library').insert({
      user_id:      currentUser.id,
      name:         file.name,
      size:         file.size,
      cover_url:    coverUrl,
      cover_path:   coverPath,
      storage_path: storagePath,
    });
    if (dbErr) throw dbErr;

    bar.style.width     = '100%';
    pStatus.textContent = 'Done!';
    setTimeout(() => prog.classList.remove('show'), 1000);
    showToast(`"${file.name}" saved to your library.`);
  } catch(err) {
    pStatus.textContent = 'Upload failed.';
    bar.style.background = 'var(--danger)';
    setTimeout(() => { prog.classList.remove('show'); bar.style.background = ''; }, 2000);
    showToast(err.message || 'Upload failed.', 'error');
    console.error(err);
  } finally {
    uploadWrap.classList.remove('disabled');
  }
}

async function openComicFromCloud(comic) {
  document.getElementById('filename').textContent = comic.name;
  document.getElementById('zoomGroup').style.display   = 'flex';
  document.getElementById('zoomDivider').style.display = 'block';

  const readerEl = document.getElementById('reader');
  readerEl.innerHTML = `<div class="state-wrapper">
    <div class="state-icon">☁️</div>
    <div class="state-title">Downloading…</div>
    <div class="loading-bar-wrap"><div class="loading-bar"></div></div>
    <div class="state-sub" style="font-size:11px;font-family:'JetBrains Mono',monospace">${escHtml(comic.name)}</div>
  </div>`;

  try {
    const { data: blob, error } = await sb.storage.from(BUCKET).download(comic.storage_path);
    if (error) throw error;
    const file = new File([blob], comic.name, { type: 'application/zip' });
    await loadCBZFromFile(file);
  } catch(err) {
    readerEl.innerHTML = `<div class="state-wrapper">
      <div class="state-icon">⚠️</div>
      <div class="state-title">Couldn't load file</div>
      <div class="state-sub">${escHtml(err.message || 'Download failed.')}</div>
    </div>`;
  }
}

// ═══════════════════════════════════════════════════════════
//  READER
// ═══════════════════════════════════════════════════════════
const pageObserver = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (e.isIntersecting) { e.target.classList.add('visible'); pageObserver.unobserve(e.target); }
  });
}, { rootMargin: '200px' });

async function loadCBZFromFile(file) {
  const readerEl = document.getElementById('reader');
  document.getElementById('zoomGroup').style.display   = 'flex';
  document.getElementById('zoomDivider').style.display = 'block';

  readerEl.innerHTML = `<div class="state-wrapper">
    <div class="state-icon">⏳</div>
    <div class="state-title">Loading…</div>
    <div class="loading-bar-wrap"><div class="loading-bar"></div></div>
  </div>`;

  try {
    const zip = await JSZip.loadAsync(file);
    const imageFiles = Object.keys(zip.files)
      .filter(n => /\.(jpg|jpeg|png|webp)$/i.test(n))
      .sort((a,b) => a.localeCompare(b, undefined, { numeric:true, sensitivity:'base' }));

    if (imageFiles.length === 0) {
      readerEl.innerHTML = `<div class="state-wrapper">
        <div class="state-icon">🔍</div>
        <div class="state-title">No images found</div>
        <div class="state-sub">This archive doesn't contain any supported images.</div>
      </div>`; return;
    }

    readerEl.innerHTML = '';
    for (const name of imageFiles) {
      const blob = await zip.files[name].async('blob');
      const url  = URL.createObjectURL(blob);
      const img  = document.createElement('img');
      img.src = url; img.className = 'page'; img.loading = 'lazy'; img.alt = name;
      readerEl.appendChild(img);
      pageObserver.observe(img);
    }
    applyZoom();
  } catch(err) {
    console.error(err);
    readerEl.innerHTML = `<div class="state-wrapper">
      <div class="state-icon">⚠️</div>
      <div class="state-title">Couldn't open file</div>
      <div class="state-sub">Make sure the file is a valid CBZ or ZIP archive.</div>
    </div>`;
  }
}

// ═══════════════════════════════════════════════════════════
//  ZOOM
// ═══════════════════════════════════════════════════════════
function applyZoom() {
  document.querySelectorAll('.page').forEach(img => img.style.width = `${zoomLevel*100}%`);
  document.getElementById('zoomReset').textContent = `${Math.round(zoomLevel*100)}%`;
}
document.getElementById('zoomIn')   .addEventListener('click', () => { zoomLevel=Math.min(3,zoomLevel+.1); applyZoom(); });
document.getElementById('zoomOut')  .addEventListener('click', () => { zoomLevel=Math.max(.2,zoomLevel-.1); applyZoom(); });
document.getElementById('zoomReset').addEventListener('click', () => { zoomLevel=1; applyZoom(); });
window.addEventListener('wheel', e => {
  if (!e.ctrlKey) return; e.preventDefault();
  zoomLevel = e.deltaY<0 ? Math.min(3,zoomLevel+.05) : Math.max(.2,zoomLevel-.05);
  applyZoom();
}, { passive:false });

// ═══════════════════════════════════════════════════════════
//  UTILS
// ═══════════════════════════════════════════════════════════
function escHtml(s='') {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function formatBytes(b) {
  if (!b) return '—';
  if (b<1024)      return b+'B';
  if (b<1048576)   return (b/1024).toFixed(1)+'KB';
  if (b<1073741824)return (b/1048576).toFixed(1)+'MB';
  return (b/1073741824).toFixed(1)+'GB';
}
function resizeBlob(blob, maxPx=300) {
  return new Promise(res => {
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const scale  = Math.min(maxPx/img.width, maxPx*1.5/img.height, 1);
        const canvas = document.createElement('canvas');
        canvas.width  = Math.round(img.width  * scale);
        canvas.height = Math.round(img.height * scale);
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        canvas.toBlob(b => res(b), 'image/jpeg', 0.75);
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(blob);
  });
}
